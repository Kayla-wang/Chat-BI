services:
  app-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi
      POSTGRES_DB: chatbi
    ports: ["5433:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbi"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  app-pgdata:
  ollama:
